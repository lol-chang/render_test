<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Origami Folding Simulator</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      #canvas { width: 100%; height: 100%; display: block; }
      #panel {
        position: fixed; top: 12px; left: 12px; width: 280px;
        background: rgba(20,22,28,0.86); backdrop-filter: blur(8px);
        border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
        padding: 14px 16px; color: #e6e8ec; font-size: 13px; line-height: 1.5;
      }
      #panel h1 { font-size: 14px; margin: 0 0 10px; font-weight: 650; letter-spacing: 0.2px; }
      #panel label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #9aa1ac; margin: 12px 0 5px; }
      select, button { font: inherit; }
      select {
        width: 100%; padding: 7px 9px; border-radius: 8px;
        background: #12151b; color: #e6e8ec; border: 1px solid rgba(255,255,255,0.12);
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .row input[type=range] { flex: 1; }
      button {
        padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
        background: #1b2430; color: #e6e8ec; cursor: pointer;
      }
      button:hover { background: #24303f; }
      button.active { background: #2d6cdf; border-color: #2d6cdf; }
      #stepLabel { font-variant-numeric: tabular-nums; color: #cbd2dc; }
      #info { margin-top: 12px; font-size: 12px; color: #aab2be; white-space: pre-line; }
      .btnrow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .hint { position: fixed; bottom: 12px; left: 12px; color: #6b7280; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="canvas"></canvas></div>
    <div id="panel">
      <h1>🦢 Origami Folding Simulator</h1>
      <label for="demo">Model</label>
      <select id="demo"></select>

      <label>Step</label>
      <div class="row">
        <input id="step" type="range" min="0" max="0" value="0" />
        <span id="stepLabel">0/0</span>
      </div>
      <div class="btnrow">
        <button id="prev">◀ Prev</button>
        <button id="next">Next ▶</button>
        <button id="topView" class="active">Top view</button>
        <button id="explode">Explode</button>
      </div>
      <div id="info"></div>
    </div>
    <div class="hint">drag = orbit · scroll = zoom · right-drag = pan</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
